name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest mypy ruff
      - name: Ruff lint
        run: ruff check arkit_sensor_fusion evaluation service tests || true
      - name: Type check
        run: mypy arkit_sensor_fusion evaluation service --ignore-missing-imports || true
      - name: Unit tests
        run: pytest -q
